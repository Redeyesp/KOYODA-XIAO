name: Build KOYODA-XIAO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-koyoda-xiaozhi:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show baseline
        shell: bash
        run: |
          set -euo pipefail

          echo "KOYODA-XIAO M1.2b"
          echo "Board: waveshare/esp32-s3-touch-amoled-1.75"
          echo "Locale: th-TH"
          echo "Wake word: disabled"

          echo "IDF_PATH=${IDF_PATH:-<unset>}"
          test -n "${IDF_PATH:-}"
          test -f "$IDF_PATH/export.sh"

          # The espressif/idf container contains ESP-IDF, but GitHub Actions
          # does not automatically source the container's IDF environment in
          # each run step.  Export it explicitly before calling idf.py.
          source "$IDF_PATH/export.sh"

          idf.py --version
          python --version

      - name: Build exact KOYODA hardware
        shell: bash
        run: |
          set -euo pipefail

          test -n "${IDF_PATH:-}"
          test -f "$IDF_PATH/export.sh"
          source "$IDF_PATH/export.sh"

          idf.py --version

          python scripts/build.py waveshare/esp32-s3-touch-amoled-1.75 \
            --name esp32-s3-touch-amoled-1.75 \
            --language th-TH \
            --wake-word disabled

      - name: Verify merged firmware
        shell: bash
        run: |
          test -f build/merged-binary.bin
          ls -lh build/merged-binary.bin
          sha256sum build/merged-binary.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: KOYODA-XIAO-M1.2b-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
